[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphs_rnh"
version = "0.1.0"
description = "Graph algorithms in Python, including Dijkstra's shortest path"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Richard Hall" }]

[tool.setuptools.packages.find]
where = ["src"]